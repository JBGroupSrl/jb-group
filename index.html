<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JB Group</title>

<!-- FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:"Open Sans",sans-serif;
  background:#f4f5f7;
  color:#101828;
}

/* NAV */
header {
  position:fixed;
  width:100%;
  top:0;
  left:0;
  background:#0b1426;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

header a {
  color:white;
  margin:0 10px;
  text-decoration:none;
  font-weight:600;
}

.hero {
  height:100vh;
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4');
  background-size:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:20px;
}

.hero h1 {
  font-size:52px;
}

.btn {
  display:inline-block;
  margin:10px;
  padding:12px 22px;
  background:#d6a934;
  color:black;
  border-radius:30px;
  font-weight:700;
  text-decoration:none;
}

.section {
  padding:120px 20px;
  max-width:1000px;
  margin:auto;
}

.card {
  background:white;
  padding:25px;
  border-radius:12px;
  margin:10px;
  flex:1;
}

.cards {
  display:flex;
  flex-wrap:wrap;
}

.dark {
  background:#0b1426;
  color:white;
}

footer {
  background:#0b1426;
  color:white;
  text-align:center;
  padding:30px;
}

@media(max-width:700px){
  .cards {
    display:block;
  }
  .hero h1 {
    font-size:34px;
  }
}
</style>
</head>

<body>

<header>
  <div style="color:#d6a934;font-weight:800;">JB Group</div>
  <div>
    <a href="#about">Über uns</a>
    <a href="#brands">Marken</a>
    <a href="#contact">Kontakt</a>
  </div>
</header>

<section class="hero">
  <div>
    <h1>Starke Marken für Holz, Energie und Alltag</h1>
    <p>Die JB Group entwickelt Marken mit Fokus auf Qualität und Nachhaltigkeit.</p>
